[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mua-do-toxic"
version = "0.1.0"
description = "Phan loai binh luan phim Mua do tren Facebook"
requires-python = ">=3.12,<3.13"

[tool.setuptools.packages.find]
where = ["."]
include = ["phien_ban_moi*"]
namespaces = false

[tool.setuptools.package-data]
"phien_ban_moi.preprocessing" = ["text_rules.json"]

[tool.pytest.ini_options]
testpaths = ["phien_ban_moi/tests"]
pythonpath = ["."]
cache_dir = "phien_ban_moi/.pytest_cache"

